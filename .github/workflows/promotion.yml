# 승격 조건 자동 점검(ADR-035 결정 1.3 (가)·(라)). PR 본문이 바뀌어도 다시 돈다(ci.yml은 본문 수정에 돌지 않는다).
# 설치 없이 node만 쓴다(scripts/ci-promotion-check.mjs는 node 내장 모듈과 git만 쓴다). 비밀 없음.
name: promotion

on:
  pull_request:
    types: [opened, synchronize, reopened, edited]
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: promotion-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: 승격 조건 점검(가·라)
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    defaults:
      run:
        working-directory: poc
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: actions/setup-node@v5
        with:
          node-version-file: poc/.nvmrc
      - name: 점검
        # PR 본문은 식에 넣지 않고 환경 변수로만 넘긴다(스크립트 주입 방지).
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
          EVENT: ${{ github.event_name }}
        run: |
          if [ "$EVENT" = "pull_request" ]; then node scripts/ci-promotion-check.mjs --body-env PR_BODY; else node scripts/ci-promotion-check.mjs; fi
