# 진단 전용(claude/p1-ci-diag-v3 브랜치만, PR 아님).
name: diag-win
on:
  push:
    branches: [claude/p1-ci-diag-v3]
permissions:
  contents: read
jobs:
  d:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-15]
    runs-on: ${{ matrix.os }}
    timeout-minutes: 50
    defaults:
      run:
        working-directory: poc
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: poc/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: poc/.nvmrc
          cache: pnpm
          cache-dependency-path: poc/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile && pnpm build
      - name: 외부 확장 위치
        continue-on-error: true
        run: |
          set +e
          ls -la "/Library/Application Support/Google/Chrome/External Extensions" "$HOME/Library/Application Support/Google/Chrome/External Extensions" /Library/Managed\ Preferences 2>&1
          cat "/Library/Application Support/Google/Chrome/External Extensions/"*.json 2>&1 | head -20
          defaults read com.google.Chrome 2>&1 | head -30
          "/Applications/Google Chrome.app/Contents/MacOS/Google Chrome" --version
          ls "/Applications/Google Chrome.app/Contents/Frameworks/Google Chrome Framework.framework/Versions/Current/Resources/" | grep -i -E "extension|default" | head
      - name: vault-relay 단독(Preferences 항목)
        continue-on-error: true
        run: DIAG_EXT=1 node --conditions=development --test --test-name-pattern="human:secret" tests/vault-relay.test.ts 2>&1 | grep -E "DIAG|ℹ (pass|fail)" | head -20
