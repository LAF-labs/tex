# CI(D14 M1-1, ADR-035 결정 1 (나)·W-11, RETRO B-01). 비밀·실계정·실 홈택스 접속 없음.
# 공개 저장소라 GitHub 호스트 러너(Linux·macOS·Windows)가 무료다. 세 잡 모두 PR·main push·수동 실행에서 돈다.
# 보안: 권한은 contents: read뿐이고, pull_request_target은 쓰지 않는다(fork PR 코드가 쓰기 토큰·비밀과 함께 돌지 않게).
# 워크플로가 secrets.*를 읽지 않으며, fork PR에는 GitHub이 비밀을 넘기지 않는다. self-hosted 러너는 쓰지 않는다(.github/RUNNER-WINDOWS.md).
name: ci

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

defaults:
  run:
    working-directory: poc
    shell: bash

env:
  CI: 'true'

jobs:
  linux:
    name: Linux build·lint·test
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      # 시험이 띄우는 Electron(있으면)은 화면 없는 러너에서 xvfb로 돈다(poc/README Linux 실행 방식).
      # 러너는 root가 아니고 node_modules의 chrome-sandbox는 SUID가 아니라서 Electron 샌드박스만 끈다(설치 Chrome은 그대로).
      ELECTRON_DISABLE_SANDBOX: '1'
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: poc/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: poc/.nvmrc
          cache: pnpm
          cache-dependency-path: |
            poc/pnpm-lock.yaml
            poc/apps/mobile/pnpm-lock.yaml
      - name: 출력 폴더(저장소 밖)
        # 시험 로그·측정 산출물은 러너 임시 폴더에 둔다(tests/measure-out.ts). 실패 시 아티팩트로 올린다.
        run: |
          echo "CI_OUT=$RUNNER_TEMP/ci-out" >> "$GITHUB_ENV"
          echo "SAX_MEASURE_DIR=$RUNNER_TEMP/ci-out/measure" >> "$GITHUB_ENV"
      - name: xvfb·한글 글꼴
        # 러너 이미지에는 한글 글꼴이 없다: OCR 시험(tests/ocr.test.ts)이 Chrome으로 그린 등록증의 한글이 빈 네모가 되어
        # tesseract kor가 읽지 못한다. sans-serif 대체로 Noto CJK가 잡히게 깐다(맥은 Apple SD Gothic Neo, 윈도는 Malgun Gothic).
        run: |
          pkgs="fonts-noto-cjk"
          command -v xvfb-run >/dev/null || pkgs="$pkgs xvfb"
          sudo apt-get update -q && sudo apt-get install -y -q --no-install-recommends $pkgs
          fc-cache -f >/dev/null
          echo "한글 글꼴:"; fc-list :lang=ko family | sort -u | head -5
          test -n "$(fc-list :lang=ko)"
      - name: 버전
        run: node -v && pnpm -v && (google-chrome --version || true)
      - name: 설치(lockfile 고정)
        run: pnpm install --frozen-lockfile
      - name: 빌드
        run: pnpm build
      - name: 린트
        run: pnpm lint
      - name: 시험
        run: |
          set -o pipefail
          mkdir -p "$CI_OUT"
          xvfb-run -a pnpm test 2>&1 | tee "$CI_OUT/test.log"
      - name: 보안 스위트
        if: ${{ hashFiles('poc/tests/security/**') != '' }}
        run: |
          set -o pipefail
          xvfb-run -a pnpm test:security 2>&1 | tee "$CI_OUT/test-security.log"
      # 폰 앱은 루트 작업공간에서 빠져 있다(apps/mobile/pnpm-workspace.yaml, 자체 잠금 파일). PR 기본 잡에서만 돈다(M5-1·M7).
      - name: 폰 앱 의존성(lockfile 고정)
        run: pnpm --dir apps/mobile install --frozen-lockfile
      - name: 폰 앱 형식 검사·시험
        run: |
          set -o pipefail
          pnpm --dir apps/mobile typecheck
          pnpm --dir apps/mobile test 2>&1 | tee "$CI_OUT/test-mobile.log"
      - name: 폰 릴레이 경로 스모크(더미 PC, 라이브·HTTPS 큐)
        run: |
          set -o pipefail
          node scripts/ci-phone-relay.mjs 2>&1 | tee "$CI_OUT/phone-relay.log"
      - name: 작업 트리 깨끗함(측정 산출물 격리)
        if: ${{ !cancelled() }}
        # TODO(M1-1-CI): 소유 트랙의 measure-out 한 줄 변경이 머지되면 --warn을 뺀다.
        run: node scripts/ci-clean-tree.mjs --warn
      - name: 시험 요약
        if: ${{ failure() }}
        run: node scripts/ci-test-summary.mjs "$CI_OUT" >> "$GITHUB_STEP_SUMMARY"
      - name: 시험 요약 아티팩트
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-linux
          path: ${{ runner.temp }}/ci-out/
          retention-days: 14
          if-no-files-found: ignore


  macos:
    name: macOS build·lint·test
    # PR에서도 전체를 돈다: 지난 macOS 런은 잡 전체 약 6분(시험 약 5분)이라 핵심만 고를 이유가 없다.
    runs-on: macos-15
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: poc/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: poc/.nvmrc
          cache: pnpm
          cache-dependency-path: poc/pnpm-lock.yaml
      - name: 출력 폴더(저장소 밖)
        # 시험 로그·측정 산출물은 러너 임시 폴더에 둔다(tests/measure-out.ts). 실패 시 아티팩트로 올린다.
        run: |
          echo "CI_OUT=$RUNNER_TEMP/ci-out" >> "$GITHUB_ENV"
          echo "SAX_MEASURE_DIR=$RUNNER_TEMP/ci-out/measure" >> "$GITHUB_ENV"
      - name: 버전
        run: node -v && pnpm -v
      - name: 설치(lockfile 고정)
        run: pnpm install --frozen-lockfile
      - name: 빌드
        run: pnpm build
      - name: 린트
        run: pnpm lint
      - name: 시험
        run: |
          set -o pipefail
          mkdir -p "$CI_OUT"
          pnpm test 2>&1 | tee "$CI_OUT/test.log"
      - name: 보안 스위트
        if: ${{ hashFiles('poc/tests/security/**') != '' }}
        run: |
          set -o pipefail
          pnpm test:security 2>&1 | tee "$CI_OUT/test-security.log"
      - name: 작업 트리 깨끗함(측정 산출물 격리)
        if: ${{ !cancelled() }}
        # TODO(M1-1-CI): 소유 트랙의 measure-out 한 줄 변경이 머지되면 --warn을 뺀다.
        run: node scripts/ci-clean-tree.mjs --warn
      - name: 시험 요약
        if: ${{ failure() }}
        run: node scripts/ci-test-summary.mjs "$CI_OUT" >> "$GITHUB_STEP_SUMMARY"
      - name: 시험 요약 아티팩트
        if: ${{ failure() }}
        uses: actions/upload-artifact@v4
        with:
          name: test-summary-macos
          path: ${{ runner.temp }}/ci-out/
          retention-days: 14
          if-no-files-found: ignore

  windows:
    name: Windows build·lint·test(비차단, #113 후속)
    # ADR-035 결정 1 (나): 두 OS. GitHub 호스트 러너(windows-latest). 공개 저장소에 self-hosted 러너는 붙이지 않는다
    # (fork PR 코드가 사용자 노트북에서 돈다). 실물 인증서·Hello·TPM 확인은 .github/RUNNER-WINDOWS.md의 수동 절차로.
    runs-on: windows-latest
    # 임시(#113 후속): audit-v 파일이 끝나지 않는 문제(핸들 누수 추정)와 V3·V10 실패를 고칠 때까지 머지를 막지 않고 20분에서 끊는다.
    # 고치면 continue-on-error를 빼고 timeout-minutes를 되돌린다.
    continue-on-error: true
    timeout-minutes: 20
    defaults:
      run:
        working-directory: poc
        shell: pwsh
    steps:
      - uses: actions/checkout@v5
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v4
        with:
          package_json_file: poc/package.json
      - uses: actions/setup-node@v5
        with:
          node-version-file: poc/.nvmrc
          cache: pnpm
          cache-dependency-path: poc/pnpm-lock.yaml
      - name: 출력 폴더(저장소 밖)
        run: |
          "CI_OUT=$env:RUNNER_TEMP/ci-out" >> $env:GITHUB_ENV
          "SAX_MEASURE_DIR=$env:RUNNER_TEMP/ci-out/measure" >> $env:GITHUB_ENV
      - run: node -v; pnpm -v
      - run: pnpm install --frozen-lockfile
      - run: pnpm build
      - run: pnpm lint
      - name: 시험
        run: |
          New-Item -ItemType Directory -Force "$env:CI_OUT" | Out-Null
          pnpm test 2>&1 | Tee-Object "$env:CI_OUT/test.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 보안 스위트
        if: ${{ hashFiles('poc/tests/security/**') != '' }}
        run: |
          pnpm test:security 2>&1 | Tee-Object "$env:CI_OUT/test-security.log"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: 작업 트리 깨끗함
        if: ${{ !cancelled() }}
        run: node scripts/ci-clean-tree.mjs --warn
      - name: 시험 요약
        if: ${{ failure() }}
        run: node scripts/ci-test-summary.mjs "$env:CI_OUT" >> $env:GITHUB_STEP_SUMMARY
      - uses: actions/upload-artifact@v4
        if: ${{ failure() }}
        with:
          name: test-summary-windows
          path: ${{ runner.temp }}/ci-out/
          retention-days: 14
          if-no-files-found: ignore
