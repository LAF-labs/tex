packages:
  - packages/*
  - apps/*
  # 폰 앱은 RN·Expo 의존을 루트 잠금 파일에 넣지 않으려고 따로 둔다(apps/mobile/pnpm-workspace.yaml). @sax/remote는 Metro가 소스로 읽는다.
  - '!apps/mobile'
  - tests
# 새로 올라온 판은 7일(10080분) 지난 뒤에만 받는다(공급망, RETRO A-14). Electron은 보안 갱신이 급해 제외 목록에 둔다.
minimumReleaseAge: 10080
minimumReleaseAgeExclude:
  - electron@45.1.0
  # 정책을 켜는 시점(2026-11-05)에 잠금 파일에 이미 있던 7일 미만 판(2026-10-30~11-02 게시). 2026-11-10 이후 지운다.
  - '@napi-rs/canvas@1.1.0'
  - '@napi-rs/canvas-android-arm64@1.1.0'
  - '@napi-rs/canvas-darwin-arm64@1.1.0'
  - '@napi-rs/canvas-darwin-x64@1.1.0'
  - '@napi-rs/canvas-linux-arm-gnueabihf@1.1.0'
  - '@napi-rs/canvas-linux-arm64-gnu@1.1.0'
  - '@napi-rs/canvas-linux-arm64-musl@1.1.0'
  - '@napi-rs/canvas-linux-riscv64-gnu@1.1.0'
  - '@napi-rs/canvas-linux-x64-gnu@1.1.0'
  - '@napi-rs/canvas-linux-x64-musl@1.1.0'
  - '@napi-rs/canvas-win32-arm64-msvc@1.1.0'
  - '@napi-rs/canvas-win32-x64-msvc@1.1.0'
  - 'semver@5.7.3'
  - 'semver@6.3.2'
  - 'tslib@2.9.1'
allowBuilds:
  better-sqlite3-multiple-ciphers: true
  electron: true
  electron-winstaller: false
  tesseract.js: false
