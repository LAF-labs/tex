<!doctype html><html lang="ko"><head><meta charset="utf-8">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self'; style-src 'self'; connect-src 'none'; img-src 'self' data:">
<link rel="stylesheet" href="app.css"><title>소버린 AX PoC</title></head>
<body>
<header><h1>소버린 AX <span class="badge">PoC 전용</span></h1><div id="status"></div></header>
<main>
<section><h2>프로필</h2>
  <div class="cols">
    <form id="pf-business" data-kind="business"><h3>사업자</h3>
      <label>표시 이름<input name="displayName" required></label>
      <label>사업자등록번호<input name="bizNo" required inputmode="numeric" placeholder="000-00-00000"></label>
      <label>법인등록번호<input name="corpNo"></label>
      <label>대표자<input name="repName"></label>
      <label>업태<input name="bizType"></label><label>종목<input name="bizItem"></label>
      <label>주소<input name="address"></label><label>이메일<input name="email" type="email"></label>
      <label>인증 방식<select name="signMethod"><option value="">-</option><option value="cert">공동인증서</option><option value="simple_auth">간편인증</option></select></label>
      <button>저장</button> <span class="msg"></span></form>
    <form id="pf-personal" data-kind="personal"><h3>개인</h3>
      <label>표시 이름<input name="displayName" required></label>
      <label>주소<input name="address"></label><label>이메일<input name="email" type="email"></label>
      <label>인증 방식<select name="signMethod"><option value="">-</option><option value="cert">공동인증서</option><option value="simple_auth">간편인증</option></select></label>
      <button>저장</button> <span class="msg"></span></form>
  </div>
</section>
<section><h2>거래처</h2>
  <div class="row"><input id="cp-q" placeholder="상호 또는 사업자번호 검색"><button id="cp-ocr" type="button">사업자등록증 이미지에서 불러오기</button></div>
  <table id="cp-table"><thead><tr><th>상호</th><th>사업자번호</th><th>대표자</th><th>이메일</th><th>확인</th><th>출처</th><th></th></tr></thead><tbody></tbody></table>
  <form id="cp-form"><h3 id="cp-form-title">거래처 추가</h3>
    <input type="hidden" name="id"><input type="hidden" name="source" value="manual">
    <label>상호<input name="name" required></label>
    <label>사업자등록번호<input name="bizNo" required inputmode="numeric"></label>
    <label>대표자<input name="repName"></label><label>주소<input name="address"></label>
    <label>이메일(세금계산서 수신)<input name="email" type="email"></label>
    <label>개업일자(진위확인용)<input name="startDate" placeholder="YYYYMMDD"></label>
    <p id="cp-ocr-note" class="note"></p>
    <button>저장</button> <button type="button" id="cp-reset">새로</button> <span class="msg"></span></form>
</section>
<section><h2>사업자 진위확인 키(공공데이터포털, 본인 키)</h2>
  <p class="note">키는 저장하지 않습니다. 앱을 다시 켜면 다시 입력해야 합니다(PoC). 공공데이터포털 '일반 인증키(Decoding)'를 넣으세요.</p>
  <form id="key-form" class="row"><input name="key" type="password" autocomplete="off" spellcheck="false"><button>설정</button> <span class="msg"></span></form>
</section>
<section><h2>금고 브라우저</h2>
  <div class="row">
    <button id="b-open" type="button">전용 Chrome 열기(홈택스)</button>
    <button id="b-secret" type="button">비밀 입력 창(인증서 비밀번호)</button>
    <button id="b-approval" type="button">승인 바 시험</button>
    <button id="b-close" type="button">Chrome 닫기</button>
  </div><p id="b-msg" class="note"></p>
</section>
<section><h2>보관함(PoC-8)</h2>
  <p class="note">홈택스 납세증명서·사업자등록증명 PDF를 고르면 격리된 창에서 글자를 읽어 발급일·유효기간을 정리합니다. 파일명에는 상호·번호를 넣지 않습니다.</p>
  <div class="row"><button id="v-import" type="button">PDF 가져오기</button> <span id="v-msg" class="msg"></span></div>
  <form id="v-password" class="row" hidden><input name="password" type="password" autocomplete="off" spellcheck="false" placeholder="PDF 열기 암호(저장하지 않음)"><button>열기</button> <button type="button" id="v-password-cancel">취소</button></form>
  <table><thead><tr><th>표시 이름</th><th>발급일</th><th>만료</th><th>만료일 출처</th><th>발급번호</th><th>상태</th><th></th></tr></thead><tbody id="v-list"></tbody></table>
  <form id="v-edit" class="row" hidden><span id="v-edit-name"></span>
    <label>종류 <select name="docType"><option value="national_tax_cert">납세증명서(국세)</option><option value="biz_registration_cert">사업자등록증명</option><option value="other">그 밖의 서류</option></select></label>
    <label>발급일 <input name="issuedOn" type="date"></label><label>만료일 <input name="expiresOn" type="date"></label>
    <button type="submit">확인·저장</button> <button type="button" id="v-edit-cancel">취소</button> <span class="msg"></span>
    <span id="v-edit-hint" class="note"></span> <button type="button" id="v-edit-use" hidden>후보 넣기</button></form>
</section>
</main><script src="app.js"></script><script src="vault-panel.js"></script></body></html>
