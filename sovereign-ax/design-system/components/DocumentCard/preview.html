<!-- @dsCard group="카드" height=220 -->
<!doctype html>
<html lang="ko">
<head><meta charset="utf-8"><title>DocumentCard</title></head>
<body>
<div class="sx-stage" style="max-width:460px">
  <article class="sx-card sx-doc">
    <span class="sx-seal" aria-label="승인 도장">승인</span>
    <div class="sx-doc-kind">홈택스 민원증명 · 즉시발급</div>
    <div class="sx-doc-name">사업자등록증명</div>
    <div class="sx-cells">
      <div><span class="label">발급일</span><span class="value">2026-10-30</span></div>
      <div><span class="label">용도</span><span class="value">지원사업 신청</span></div>
      <div><span class="label">유효</span><span class="value">D-30</span></div>
    </div>
    <div class="sx-actions"><button class="sx-btn sx-btn-primary" type="button">열기</button><button class="sx-btn" type="button">메일로 보내기</button><button class="sx-btn sx-btn-quiet" type="button">만료 알림 켜기</button></div>
  </article>
</div>
</body>
</html>
